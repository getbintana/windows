# The Windows installers: one setup executable per application in `apps/`,
# and one portable build environment, published as the releases of the
# repository this runs in. Copy this file to `.github/workflows/build.yml` in
# that repository, and `apps/` beside it; see README.md for the one-time setup.
#
# **The same registry as the Flatpak repository** (`flatpak/ci`), and the same
# bargain: every directory in `apps/` with an `app.json` is an application, and
# nothing in this file names one. What differs is what is published -- a
# `<command>-<version>-windows-x86_64.exe` attached to the release
# `<app>-<version>`, instead of a branch in an OSTree repository -- and where
# the state lives: `builds.json` on the `state` branch.
#
# What is rebuilt, decided by the "What changed" step:
#
#   - no state, or a run asked for everything -> every application;
#   - the runtime, `lib/`, the vendor, the     -> every application, because
#     packaging, the portable tree's recipe,      each installer carries its
#     the licences                                own copy of the runtime and
#                                                 its notices;
#   - the MSYS2 package list in this file      -> every application: the DLLs,
#                                                 the data and the notice texts
#                                                 of those packages are the
#                                                 payload's;
#   - an application's `watch` paths, for one  -> it alone;
#     that lives in the runtime's repository
#   - an application's own repository          -> it alone, when its commit moved;
#   - an application's registration           -> it alone, when its `app.json`
#                                                 changed.
#
# A rebuild of a version that already has a release replaces its setup in
# place (`--clobber`): a new runtime under the same application version is the
# same release, rebuilt. A new version is a new release.
#
# The build environment is the one release that is not an application:
# `build-<version>` with `bintana-build-<version>-windows-x86_64.zip`, the
# MSYS2 UCRT64 tree (GCC, the headers, git, ...) for developing Bintana itself
# on Windows. It is rebuilt when its recipe changes -- the script, the package
# list in this file, or the runtime's `CMakeLists.txt` -- or on an everything
# run, and replaced in place like a setup.
name: windows installers

on:
  workflow_dispatch:
    inputs:
      all:
        description: "Rebuild every application, whatever changed"
        type: boolean
        default: false
  schedule:
    - cron: "47 4 * * *"
  push:
    branches: [main]

permissions:
  contents: write

# Two runs at once would both read the same state and both push it.
concurrency:
  group: windows-installers
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: The state
        uses: actions/checkout@v4
        with:
          ref: state
          path: state

      - name: This repository, for the registry
        uses: actions/checkout@v4
        with:
          path: ci

      - name: The runtime's source
        uses: actions/checkout@v4
        with:
          repository: getbintana/bintana
          path: sources/bintana
          fetch-depth: 0
          submodules: recursive

      # One checkout per application with a repository of its own, named after
      # its directory in the registry. The ones that live in the runtime's
      # repository are the checkout above. Git Bash, not MSYS2: the runner's
      # own git and python are on its PATH, and MSYS2 is only installed when
      # there is something to build.
      - name: The applications' sources
        shell: bash
        run: |
          set -euo pipefail
          for entry in ci/apps/*/app.json; do
              [ -e "$entry" ] || continue
              name=$(basename "$(dirname "$entry")")
              repo=$(python -c 'import json,sys;print(json.load(open(sys.argv[1])).get("repo",""))' "$entry")
              [ -n "$repo" ] || continue

              ref=$(python -c 'import json,sys;print(json.load(open(sys.argv[1])).get("ref",""))' "$entry")
              echo "== $name: $repo${ref:+ at $ref}"
              git clone --quiet ${ref:+--branch "$ref"} --depth 1 "$repo" "sources/$name"
          done

      - name: What changed
        id: plan
        shell: bash
        env:
          ALL: ${{ inputs.all && 'yes' || '' }}
        run: |
          set -euo pipefail
          plan=$(mktemp)
          python - <<'EOF' | tr -d '\r' > "$plan"
          import glob, hashlib, json, os, subprocess

          # What every installer is made of besides the application: a change
          # in any of these is a change in every setup. The licences are the
          # payload's too -- a setup redistributes the DLLs, so their notices
          # and `THIRD-PARTY-NOTICES.md` travel in `share/licenses`, and
          # `lib/package/Nsis.js` carries that directory into every one.
          RUNTIME = ["runtime", "lib", "vendor", "CMakeLists.txt",
                     "tools/pack", "tools/windows-portable.sh",
                     "tools/windows-licenses.sh",
                     "LICENSE", "THIRD-PARTY-NOTICES.md"]

          path  = "state/builds.json"
          state = json.load(open(path)) if os.path.exists(path) else {}
          seen  = state.get("apps", {})

          def git(where, *args):
              return subprocess.run(["git", "-C", where, *args],
                                    capture_output=True, text=True)

          def moved(since, paths):
              """Whether `paths` of the runtime's source differ from `since`.
              A commit the history no longer has (a force push) counts as a
              change: there is nothing to compare with."""
              if not since:
                  return True
              diff = git("sources/bintana", "diff", "--quiet", since, "HEAD", "--", *paths)
              return diff.returncode != 0

          # The MSYS2 packages every installer is compiled against. They are
          # an input like the source is -- a DLL and its licence land in the
          # payload, a missing one is a feature the setup silently lacks (the
          # terminal was one: `libvterm` arrived in the runtime's own job and
          # not here) -- so a list that moved is a change in every setup.
          #
          # **The list and not the file.** A comment in this workflow is not a
          # setup, and rebuilding four 460 MB installers for one is how a
          # workflow stops being run when it matters. The `install:` block is
          # the YAML block scalar under `with:` of `setup-msys2`.
          def toolchain():
              block, indent = [], None
              for line in open("ci/.github/workflows/build.yml").read().splitlines():
                  if indent is None:
                      if line.strip().startswith("install:"):
                          indent = len(line) - len(line.lstrip())
                      continue
                  if not line.strip():
                      continue
                  if len(line) - len(line.lstrip()) <= indent:
                      break
                  block.append(line.strip())
              return hashlib.sha256("\n".join(block).encode()).hexdigest()

          pkgs = toolchain()

          everything = (bool(os.environ.get("ALL")) or
                        state.get("toolchain") != pkgs or
                        moved(state.get("runtime"), RUNTIME))

          # The build environment is the toolchain, not the source: its recipe
          # is its own script, the package list in this workflow, and the
          # runtime's build configuration (a new version is a new release).
          # A hash and not a commit, so a failed build is retried instead of
          # recorded as done. `pkgs` and not this file, for the reason above.
          def digest(path):
              return hashlib.sha256(open(path, "rb").read()).hexdigest() \
                     if os.path.exists(path) else ""

          dev_hash = hashlib.sha256("".join([
              digest("sources/bintana/tools/windows-build-tree.sh"),
              digest("sources/bintana/CMakeLists.txt"),
              pkgs,
          ]).encode()).hexdigest()
          dev = bool(os.environ.get("ALL")) or dev_hash != state.get("build_env")

          names = []
          for entry in sorted(glob.glob("ci/apps/*/app.json")):
              name = os.path.basename(os.path.dirname(entry))
              app  = json.load(open(entry))
              old  = seen.get(name)
              hash = hashlib.sha256(open(entry, "rb").read()).hexdigest()

              if everything or not old or old.get("entry") != hash:
                  names.append(name)
              elif app.get("repo"):
                  head = git(f"sources/{name}", "rev-parse", "HEAD").stdout.strip()
                  if head != old.get("commit"):
                      names.append(name)
              elif moved(old.get("commit"), app.get("watch", ["."])):
                  names.append(name)

          print(" ".join(names))
          print("yes" if dev else "no")
          print(dev_hash)
          print(pkgs)
          EOF
          mapfile -t decided < "$plan"
          rm -f "$plan"
          apps=${decided[0]:-}
          dev=${decided[1]:-no}
          dev_hash=${decided[2]:-}
          pkgs=${decided[3]:-}
          echo "decided: apps=${apps:-none} build-env=$dev"
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "dev=$dev" >> "$GITHUB_OUTPUT"
          echo "dev_hash=$dev_hash" >> "$GITHUB_OUTPUT"
          echo "toolchain=$pkgs" >> "$GITHUB_OUTPUT"

          # And what each one carries of the runtime tree besides the runtime
          # (`with`), one path a line: the MSYS2 steps have no python to read
          # the registry with, so it is read here, where there is one.
          mkdir -p with
          for name in $apps; do
              python -c 'import json,sys;print("\n".join(json.load(open(sys.argv[1])).get("with",[])))' \
                  "ci/apps/$name/app.json" | tr -d '\r' > "with/$name"
          done

      # The installers need the first block; the build environment adds what a
      # person needs to build Bintana itself -- git, make, gettext, the full
      # compiler group -- and it is installed either way, so the portable tree
      # is exactly the one the installers were built from.
      - uses: msys2/setup-msys2@v2
        if: steps.plan.outputs.apps != '' || steps.plan.outputs.dev == 'yes'
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-gtksourceview5
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-libsoup3
            mingw-w64-ucrt-x86_64-libxml2
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-libav
            mingw-w64-ucrt-x86_64-gst-plugins-rs
            mingw-w64-ucrt-x86_64-poppler
            mingw-w64-ucrt-x86_64-libvterm
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-make
            git
            gettext
            openssh
            ca-certificates
            make
            patch
            diffutils
            autoconf
            automake
            libtool
            bison
            flex
            zip
            unzip
            rsync
            wget

      # The runtime as a Windows user gets it: built, then laid out by
      # `tools/windows-portable.sh` -- the DLLs, the GTK data, the icon themes
      # -- which is the tree every installer below is staged from. The same
      # two steps as the runtime's own `windows` job.
      - name: The runtime tree
        if: steps.plan.outputs.apps != ''
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd sources/bintana
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build -j"$(nproc)"
          tools/windows-portable.sh build "$GITHUB_WORKSPACE/stage/runtime"

      # The compiler, inside the tree where `Nsis.makensis` looks first
      # (`share/bintana/tools/nsis`) -- the subset of the official distribution
      # the runtime's job bundles, and for the reasons written there: `Bin` is
      # the real compiler behind a 2 KiB forwarder, and `Contrib` is the Modern
      # UI `MUI2.nsh` forwards to. A failed download falls back to the NSIS the
      # runner image carries, put on the PATH -- and then an application that
      # carries `share/bintana/tools/nsis` (the IDE) is refused by name in the
      # Build step, rather than released without it.
      - name: The NSIS compiler
        if: steps.plan.outputs.apps != ''
        shell: msys2 {0}
        run: |
          set -euo pipefail
          dest=stage/runtime/share/bintana/tools/nsis
          work=$(mktemp -d)
          if curl -fsSL -o "$work/nsis.zip" \
                  "https://sourceforge.net/projects/nsis/files/NSIS%203/3.12/nsis-3.12.zip/download" \
              && (cd "$work" && cmake -E tar xf nsis.zip); then
              exe=$(find "$work" -name makensis.exe -not -path "*/Bin/*" | head -1)
              base=$(dirname "$exe")
              mkdir -p "$dest"
              for f in makensis.exe COPYING Bin Include Stubs Plugins Contrib; do
                  [ -e "$base/$f" ] && mv "$base/$f" "$dest/"
              done
          fi
          if [ -f "$dest/Bin/makensis.exe" ] && [ -f "$dest/Contrib/Modern UI 2/MUI2.nsh" ]; then
              echo "nsis: the bundle, $(find "$dest" -type f | wc -l) files"
          else
              rm -rf "$dest"
              echo "/c/Program Files (x86)/NSIS" >> "$GITHUB_PATH"
              echo "nsis: no bundle -- the runner's own" >&2
          fi

      # One installer per application: `tools/pack.sh --nsis` writes the script
      # out of the metainfo, stages the runtime tree and the project as the
      # payload, and compiles it. The setup is named by the script itself
      # (`<command>-<version>-windows-x86_64.exe`), so nothing here spells it.
      # **Absolute paths**: `pack.sh` changes to the runtime's checkout first.
      # `with` becomes one `--with` per path, and a path the tree does not have
      # stops the run: an installer asked to be complete is never quietly not.
      - name: Build
        if: steps.plan.outputs.apps != ''
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="$PATH:/c/Program Files (x86)/NSIS"
          root=$PWD
          for name in ${{ steps.plan.outputs.apps }}; do
              entry="ci/apps/$name/app.json"
              project=$(sed -n 's/.*"project": *"\([^"]*\)".*/\1/p' "$entry")
              if grep -q '"repo"' "$entry"; then
                  src="$root/sources/$name/$project"
              else
                  src="$root/sources/bintana/$project"
              fi

              extra=()
              while IFS= read -r path; do
                  [ -n "$path" ] && extra+=(--with "$path")
              done < "with/$name"

              echo "== $name: $src${extra[*]:+ ${extra[*]}}"
              BINTANA="$root/stage/runtime/bin/bintana.exe" \
                  sources/bintana/tools/pack.sh --nsis "$src" "$root/stage/apps/$name" \
                      --prefix "$root/stage/runtime" "${extra[@]}"
              setup=$(ls "$root"/stage/apps/"$name"/*-windows-x86_64.exe)
              # The checksum the release carries, computed here, in the shell
              # that has the MSYS2 hashers. A bare name inside, so a reader in
              # their download directory is `sha256sum -c` and no editor.
              ( cd "$(dirname "$setup")" && sha256sum "$(basename "$setup")" \
                    > "$(basename "$setup").sha256" )
              ls -l "$setup" "$setup.sha256"
          done

      # What was just built, installed and run -- before anything is
      # published, so a setup that installs a program that does not start is
      # not released either. The installer is the per-user one the script
      # writes (`$LOCALAPPDATA`, no elevation), so `/S` installs it silently,
      # here into a directory of the run's own (`/D=` is last and unquoted, as
      # NSIS wants it). Then the installed runtime answers `--version` -- the
      # DLL closure -- and runs one console project, the same smoke the
      # Flatpak repository runs: a `main` project never initialises GTK, so it
      # needs no desktop, and its `Decimal` is the vendored arithmetic patch
      # answering from inside the installed tree. And the application's own
      # project has to be where the shortcut points, and `bintana-gui.exe` --
      # what the shortcut starts -- has to be a GUI executable, or the
      # application opens with a console behind it.
      #
      # **The questions only the installed tree can answer.** `Video` is the
      # GStreamer registry's sink and `PdfDocument.CanRead` is poppler's build
      # flag; a setup that lost `lib/gstreamer-1.0`, `share/gstreamer-1.0` or
      # `share/poppler` installed and launched and answered false for both
      # (`docs/agents/packaging.md`, measured on Windows 11). `Terminal` is
      # `libvterm`'s, and false from a tree built without the package. The
      # probe runs in the graphical host -- `Widget` is not installed for a
      # `main` under `bintana.exe` -- and writes its answers to a file, because
      # a GUI executable's `print` is not seen from a shell.
      #
      # **And the licences.** The payload carries `share/licenses` (Bintana's,
      # QuickJS's and the MSYS2 packages' texts), which is what makes
      # redistributing the DLLs beside them legal; a setup that lost it ships
      # binaries whose notices nobody has.
      #
      # **On a clean machine's PATH.** This shell has `/ucrt64/bin` on its
      # PATH, which holds every DLL and helper the tree should carry, so a run
      # here would find a missing one there and pass -- GLib's spawn helpers
      # went missing exactly like that. The installed tree is run with only
      # Windows' own directories, by both executables, and both projects start
      # a child with its output piped, which is what goes through the helper:
      # `bintana.exe` uses the `-console` one, `bintana-gui.exe` the other.
      #
      # `MSYS2_ARG_CONV_EXCL`: MSYS2 rewrites an argument that looks like a
      # path, and `/S` looks like one.
      - name: Smoke
        if: steps.plan.outputs.apps != ''
        shell: msys2 {0}
        run: |
          set -euo pipefail
          smoke=$(mktemp -d)
          cat > "$smoke/project.btp" <<'EOF'
          {
              "name": "smoke",
              "main": "Main",
              "sources": ["Main.js"]
          }
          EOF
          cat > "$smoke/Main.js" <<'EOF'
          function Main() {
              const answer = new Decimal("10") / 3 * 3;
              print("smoke: " + answer);
              /* A child with its output piped: through GLib's spawn helper. */
              const child = Exec.Wait([Application.Executable, "--version"]);
              print("smoke: the child said " + child.Output.trim());
              Application.Quit(answer.toString() === "10" && child.ExitCode === 0 ? 0 : 1);
          }
          EOF

          probe=$(mktemp -d)
          cat > "$probe/project.btp" <<'EOF'
          {
              "name": "probe",
              "main": "Main",
              "sources": ["Main.js"]
          }
          EOF
          cat > "$probe/Main.js" <<'EOF'
          function Main() {
              /* A throw is a line in the answer file and not a dialog waiting
               * on a click nobody will make. */
              Application.OnError = (e) => {
                  File.Save(File.Join(Application.Directory, "answer.txt"), "error=" + e + "\n");
                  Application.Quit(1);
              };
              const child = Exec.Wait([Application.Executable, "--version"]);
              File.Save(File.Join(Application.Directory, "answer.txt"),
                        "exec=" + child.ExitCode + "\n" +
                        "video=" + Widget.Available("Video") + "\n" +
                        "pdf=" + PdfDocument.CanRead + "\n" +
                        "terminal=" + Widget.Available("Terminal") + "\n");
              Application.Quit(child.ExitCode === 0 ? 0 : 1);
          }
          EOF

          clean="/c/Windows/System32:/c/Windows"
          for name in ${{ steps.plan.outputs.apps }}; do
              setup=$(ls stage/apps/"$name"/*-windows-x86_64.exe)
              # `Package.commandName`: `bintana-` and the id's last element.
              id=$(sed -n 's/.*"id": *"\([^"]*\)".*/\1/p' "ci/apps/$name/app.json")
              cmd=bintana-$(printf '%s' "${id##*.}" | tr 'A-Z' 'a-z' \
                                | sed 's/[^a-z0-9]\+/-/g; s/^-*//; s/-*$//')
              into="$RUNNER_TEMP/install/$name"

              echo "-- $name: $(basename "$setup")"
              MSYS2_ARG_CONV_EXCL='*' "$setup" /S "/D=$(cygpath -w "$into")"
              test -f "$into/bin/$cmd.cmd"
              test -f "$into/share/bintana/apps/$cmd/project.btp"
              test -f "$into/Uninstall.exe"
              # The two hosts and the helper keep their subsystems: what a
              # shortcut starts is the GUI one, and `bintana-exec.exe` is GUI
              # so that a console tool an application runs has no window of
              # its own -- the core is console, which `--version` wants.
              objdump -p "$into/bin/bintana-gui.exe" | grep -q 'Windows GUI' \
                  || { echo "$name: bintana-gui.exe is not a GUI executable" >&2; exit 1; }
              objdump -p "$into/bin/bintana.exe" | grep -q 'Windows CUI' \
                  || { echo "$name: bintana.exe is not a console executable" >&2; exit 1; }
              objdump -p "$into/bin/bintana-exec.exe" | grep -q 'Windows GUI' \
                  || { echo "$name: bintana-exec.exe is not a GUI executable" >&2; exit 1; }
              # Adwaita inherits AdwaitaLegacy, where its full-colour icons are.
              for theme in Adwaita AdwaitaLegacy hicolor; do
                  test -f "$into/share/icons/$theme/index.theme" \
                      || { echo "$name: installed without the $theme icon theme" >&2; exit 1; }
              done
              while IFS= read -r path; do
                  [ -z "$path" ] || test -e "$into/$path" \
                      || { echo "$name: installed without $path" >&2; exit 1; }
              done < "with/$name"
              # `share/doc/bintana` is README, CHANGELOG and the notices now,
              # and never the contributors' `docs/` (the notes, the plans, the
              # audit), which is for whoever works on the runtime.
              # `tests/install` asks `cmake --install` the same question.
              if grep -qx 'share/doc/bintana' "with/$name"; then
                  for doc in README.md CHANGELOG.md; do
                      test -f "$into/share/doc/bintana/$doc" \
                          || { echo "$name: installed without share/doc/bintana/$doc" >&2; exit 1; }
                  done
                  [ ! -d "$into/share/doc/bintana/docs" ] \
                      || { echo "$name: installed the contributors' docs/ beside the release" >&2; exit 1; }
              fi
              # The DLLs a setup redistributes carry their notices: Bintana's,
              # QuickJS's (the engine is embedded) and the MSYS2 packages'
              # texts `tools/windows-licenses.sh` copies.
              for file in LICENSE-Bintana LICENSE-QuickJS THIRD-PARTY-NOTICES.md \
                          MSYS2-PACKAGES.md; do
                  test -f "$into/share/licenses/bintana/$file" \
                      || { echo "$name: installed without share/licenses/bintana/$file" >&2; exit 1; }
              done
              # GTK imports vulkan-1.dll at load time, the SVG loader imports
              # librsvg-2-2.dll and the graphical host imports libvterm-0.dll:
              # none is Windows' own, and the runner's System32 has a Vulkan
              # loader, so a setup missing one still runs here and fails on a
              # machine whose driver ships none.
              for dll in vulkan-1.dll librsvg-2-2.dll libvterm-0.dll; do
                  test -f "$into/bin/$dll" \
                      || { echo "$name: installed without $dll" >&2; exit 1; }
              done
              PATH="$clean" "$into/bin/bintana.exe" --version
              PATH="$clean" "$into/bin/bintana.exe" "$smoke"
              # No console, so nothing the graphical host prints is seen: its
              # answers go to a file, and the exit code says whether it ran.
              rm -f "$probe/answer.txt"
              PATH="$clean" "$into/bin/bintana-gui.exe" "$probe" \
                  || { cat "$probe/answer.txt" 2>/dev/null || true
                       echo "$name: bintana-gui.exe could not run the probe" >&2; exit 1; }
              answers=$(cat "$probe/answer.txt")
              echo "$answers"
              for want in 'exec=0' 'video=true' 'pdf=true' 'terminal=true'; do
                  grep -qx "$want" <<<"$answers" \
                      || { echo "$name: the installed tree did not answer $want" >&2; exit 1; }
              done
          done

      # A release per application version, the setup attached to it. A version
      # with a letter in it (`0.2.0rc1`, `1.0beta`) is a prerelease, so the
      # repository's "latest" stays on the last final one. Then the state, so
      # the next run knows what moved -- after the releases, so a failed upload
      # is rebuilt next time rather than recorded as done.
      #
      # `GH_REPO`, because `gh` finds the repository from the git checkout it
      # runs in, and the workspace's root is none -- the checkouts are `state`,
      # `ci` and `sources/*` under it.
      - name: Publish
        if: steps.plan.outputs.apps != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TOOLCHAIN: ${{ steps.plan.outputs.toolchain }}
        run: |
          set -euo pipefail
          for name in ${{ steps.plan.outputs.apps }}; do
              setup=$(ls stage/apps/"$name"/*-windows-x86_64.exe)
              entry="ci/apps/$name/app.json"
              # `tr -d '\r'`: the runner's python is a Windows one, and its
              # `print` ends the line `\r\n` -- which the shell keeps, so the
              # body of a release came out with a carriage return before the
              # closing backtick (see the published ones). The same fix the
              # plan step carries.
              read -r src commit < <(python - "$name" "$entry" <<'EOF' | tr -d '\r'
          import json, subprocess, sys
          name, entry = sys.argv[1], sys.argv[2]
          app = json.load(open(entry))
          src = f"sources/{name}" if app.get("repo") else "sources/bintana"
          commit = subprocess.check_output(["git", "-C", src, "rev-parse", "HEAD"], text=True).strip()
          print(f"{src}/{app['project']} {commit}")
          EOF
              )
              title=$(python -c 'import json,sys;print(json.load(open(sys.argv[1]))["name"])' "$src/project.btp" | tr -d '\r')
              version=$(python -c 'import json,sys;print(json.load(open(sys.argv[1])).get("version","0.0"))' "$src/project.btp" | tr -d '\r')
              tag="$name-$version"
              runtime=$(git -C sources/bintana rev-parse HEAD)
              repo=$(python -c 'import json,sys;print(json.load(open(sys.argv[1])).get("repo","https://github.com/getbintana/bintana"))' "$entry" | tr -d '\r')
              notes="$title $version for Windows (x86_64): built from ${repo%.git} at \`$commit\`, on the runtime getbintana/bintana at \`$runtime\`."

              pre=""
              [[ $version =~ [A-Za-z] ]] && pre="--prerelease"

              if ! gh release view "$tag" >/dev/null 2>&1; then
                  gh release create "$tag" --target "$GITHUB_SHA" $pre \
                      --title "$title $version" --notes "$notes"
              fi
              gh release upload "$tag" "$setup" "$setup.sha256" --clobber
              # The setup is replaced in place under the same tag, so the body
              # has to be replaced with it: left alone it names the commit of
              # the first publish that created the release, not the one the
              # asset under it was built from.
              gh release edit "$tag" --notes "$notes"
              echo "== $name: $(basename "$setup") in $tag"
          done

          python - ${{ steps.plan.outputs.apps }} <<'EOF'
          import hashlib, json, os, subprocess, sys

          path  = "state/builds.json"
          state = json.load(open(path)) if os.path.exists(path) else {}
          state.setdefault("apps", {})

          def commit(where):
              return subprocess.check_output(
                  ["git", "-C", where, "rev-parse", "HEAD"], text=True).strip()

          state["runtime"] = commit("sources/bintana")
          # What every setup was compiled against, recorded with them: the
          # package list is not in the runtime's history, so this is the only
          # place the plan can see it from.
          state["toolchain"] = os.environ["TOOLCHAIN"]
          bintana = "https://github.com/getbintana/bintana.git"
          for name in sys.argv[1:]:
              entry = f"ci/apps/{name}/app.json"
              app   = json.load(open(entry))
              state["apps"][name] = {
                  "repo":   app.get("repo", bintana),
                  "commit": commit(f"sources/{name}" if app.get("repo") else "sources/bintana"),
                  "entry":  hashlib.sha256(open(entry, "rb").read()).hexdigest(),
              }

          json.dump(state, open(path, "w"), indent=2)
          EOF

          cd state
          git config user.name  "bintana-windows"
          git config user.email "noreply@github.com"
          git add -A
          if git diff --cached --quiet; then
              echo "nothing new to record"
          else
              git commit -m "windows: ${{ steps.plan.outputs.apps }}"
              git push
          fi

      # The same packages as a portable tree: the environment Bintana is
      # developed in on Windows, for somebody who does not have MSYS2 at all.
      # It runs after the setups are published so a failure here cannot keep
      # an application release from shipping; the job still goes red.
      - name: The build environment
        if: steps.plan.outputs.dev == 'yes'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          version=$(grep -m1 -oP 'project\(bintana VERSION \K[0-9][^ )]*' sources/bintana/CMakeLists.txt)
          name="bintana-build-${version}-windows-x86_64"
          sources/bintana/tools/windows-build-tree.sh "$GITHUB_WORKSPACE/stage/$name"
          cd "$GITHUB_WORKSPACE/stage"
          sevenz="/c/Program Files/7-Zip/7z.exe"
          if [ -x "$sevenz" ]; then
              "$sevenz" a -tzip -mm=Deflate -mx=7 "$name.zip" "$name"
          else
              cmake -E tar cf "$name.zip" --format=zip "$name"
          fi
          size=$(stat -c %s "$name.zip")
          [ "$size" -lt 2000000000 ] \
              || { echo "build environment: $size bytes is over GitHub's 2 GB asset limit" >&2; exit 1; }
          sha256sum "$name.zip" > "$name.zip.sha256"
          ls -lh "$name.zip" "$name.zip.sha256"

      # A release of its own, `build-<version>`: the same rule as the setups,
      # a rebuild under the same version replaces the ZIP in place, and a
      # version with a letter in it is a prerelease.
      - name: Publish the build environment
        if: steps.plan.outputs.dev == 'yes'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(grep -m1 -oP 'project\(bintana VERSION \K[0-9][^ )]*' sources/bintana/CMakeLists.txt)
          zip=$(ls stage/bintana-build-"$version"-windows-x86_64.zip)
          tag="build-$version"
          pre=""
          [[ $version =~ [A-Za-z] ]] && pre="--prerelease"
          runtime=$(git -C sources/bintana rev-parse HEAD)
          notes="The MSYS2 UCRT64 environment Bintana is built with on Windows (x86_64): GCC, binutils, gdb, cmake, ninja, pkgconf, git, gettext, GTK4, GtkSourceView 5, sqlite3, libsoup3, libxml2, GStreamer with gst-plugins-rs (the GTK4 sink), poppler and libvterm, headers included. Unzip it, run \`bintana-build.cmd\`, and build getbintana/bintana at \`$runtime\`."
          if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" --target "$GITHUB_SHA" --latest=false $pre \
                  --title "Bintana build $version for Windows" --notes "$notes"
          fi
          gh release upload "$tag" "$zip" "$zip.sha256" --clobber
          # The recipe changed and the ZIP was replaced under the same tag: the
          # body names the commit the tree is from, so it is rewritten with it.
          gh release edit "$tag" --notes "$notes"
          echo "== build: $(basename "$zip") in $tag"

      # And the state, after the upload: a failed ZIP is rebuilt next time,
      # not recorded as done.  Only `build_env` moves here; the applications
      # and the runtime's own record were already written by Publish.
      - name: Record the build environment
        if: steps.plan.outputs.dev == 'yes'
        shell: bash
        env:
          DEV_HASH: ${{ steps.plan.outputs.dev_hash }}
        run: |
          set -euo pipefail
          python - <<'EOF'
          import json, os

          path  = "state/builds.json"
          state = json.load(open(path)) if os.path.exists(path) else {}

          state["build_env"] = os.environ["DEV_HASH"]

          json.dump(state, open(path, "w"), indent=2)
          EOF

          cd state
          git config user.name  "bintana-windows"
          git config user.email "noreply@github.com"
          git add -A
          if git diff --cached --quiet; then
              echo "nothing new to record"
          else
              git commit -m "windows: build"
              git push
          fi
